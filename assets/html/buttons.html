<!-- buttons.html -->
<div id="floating-buttons" style="
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
">
    <a href="../index.html" title="Go to index" style="
           display: inline-flex;
           justify-content: center;
           align-items: center;
           width: 36px;
           height: 36px;
           background: #2a7ae2;
           color: white;
           text-decoration: none;
           border-radius: 50%;
           font-weight: bold;
           font-size: 18px;
           text-align: center;
           line-height: 1;
           cursor: pointer;
       ">
        ←
    </a>

    <button id="scroll-top-btn" title="Scroll to top" style="
                display: none;
                justify-content: center;
                align-items: center;
                width: 36px;
                height: 36px;
                background: #555;
                color: white;
                border: none;
                border-radius: 50%;
                font-weight: bold;
                font-size: 18px;
                cursor: pointer;
            " onclick="window.scrollTo({top:0, behavior:'smooth'})">
        ↑
    </button>
</div>

<script>
    const scrollBtn = document.getElementById('scroll-top-btn');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 100) {
            scrollBtn.style.display = 'flex';
        } else {
            scrollBtn.style.display = 'none';
        }
    });
</script>
